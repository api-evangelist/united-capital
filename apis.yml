name: United Capital
description: >-
  United Capital (United Capital Financial Advisers / United Capital Financial
  Partners) was a US wealth counseling and financial life management firm
  founded in 2005, known for its FinLife CX white-label advisor technology
  platform. Bessemer Venture Partners partnered with the company in 2009. At
  acquisition it managed roughly $25 billion for 22,000 clients through 220+
  advisors in over 90 offices. Goldman Sachs acquired United Capital in May
  2019 for $750 million in cash, rebranding it Goldman Sachs Personal Financial
  Management, which Creative Planning acquired in 2023. The company no longer
  operates independently and publishes no public API or developer surface; its
  historic domain unitedcp.com now returns HTTP 404.
